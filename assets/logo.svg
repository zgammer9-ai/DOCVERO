<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" fill="none">
  <defs>
    <linearGradient id="dv-full-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066ff" />
      <stop offset="100%" stop-color="#0047d4" />
    </linearGradient>
    <linearGradient id="dv-full-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0099ff" />
    </linearGradient>
  </defs>

  <!-- Logo Mark -->
  <g transform="translate(5, 5) scale(0.85)">
    <!-- Outer 'D' Document Body -->
    <path d="M15 18 C15 13 19 9 24 9 L60 9 C62 9 64 10 65 11 L83 29 C85 31 86 33 86 36 L86 73 C86 83 78 91 68 91 L24 91 C19 91 15 87 15 82 Z" fill="url(#dv-full-blue)" />

    <!-- Inner Document Sheet (White cutout) -->
    <path d="M29 23 C29 20 31 18 34 18 L58 18 L72 32 L72 73 C72 78 68 82 63 82 L34 82 C31 82 29 80 29 77 Z" fill="#ffffff" />

    <!-- Top-Right Folded Dog-Ear Corner -->
    <path d="M58 9 L58 24 C58 28 61 31 65 31 L84 31 Z" fill="url(#dv-full-fold)" />

    <!-- 3 Document Content Lines -->
    <rect x="35" y="47" width="24" height="4.5" rx="2.25" fill="#005ce6" />
    <rect x="35" y="56" width="30" height="4.5" rx="2.25" fill="#005ce6" />
    <rect x="35" y="65" width="16" height="4.5" rx="2.25" fill="#005ce6" />
  </g>

  <!-- Wordmark -->
  <text x="96" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="44" letter-spacing="-0.5px">
    <tspan fill="#0c2340" class="brand-doc">DOC</tspan><tspan fill="#0066ff">VERO</tspan>
  </text>

  <!-- Tagline -->
  <text x="98" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-weight="500" font-size="16" fill="#5a6a85" letter-spacing="-0.2px">
    Your everyday file toolkit.
  </text>
</svg>
